name: CI & Deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, mbstring, dom, xml, xmlwriter, curl

      - name: Install PHP dependencies (with dev)
        run: composer install --no-interaction

      - name: Lint Twig templates
        run: php bin/console lint:twig templates/

      - name: Lint YAML config
        run: php bin/console lint:yaml config

      - name: Lint DI container
        run: php bin/console lint:container

      - name: Lint PHP code samples in chapters
        run: php scripts/lint-php-snippets.php

      - name: Check Messenger routing classes exist
        run: php scripts/check_messenger_routing.php

      - name: Check for ambiguous duplicate listings
        run: php scripts/check_duplicate_listings.php

      - name: Check named arguments against constructors
        run: php scripts/check_named_arguments.php

      - name: Check property access against declared types
        run: php scripts/check_property_access.php

      - name: Check class names resolve to an import
        run: php scripts/check_use_statements.php

      - name: Check static calls against defined classes
        run: php scripts/check_static_calls.php

      - name: Check FAQ blocks parse as YAML
        run: php scripts/check_faq_yaml.php

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Assets musí být zbuildované před PHPUnit — smoke testy renderují
      # stránky a vite_entry_link_tags čte manifest z public/build/.
      - name: Build assets
        run: npm ci && npx vite build

      - name: Run PHPUnit
        run: php bin/phpunit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Axe accessibility check (dark + light)
        run: |
          php -S 127.0.0.1:8765 -t public scripts/dev-router.php &
          sleep 2
          node scripts/axe-check.mjs

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction
        env:
          APP_ENV: prod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies and build assets
        run: npm ci && npx vite build

      - name: Set asset version from git commit
        run: echo "APP_VERSION=$(git rev-parse --short HEAD)" > .env.prod

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /www/subdom/ddd-v-symfony/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            _hidden/**
            screenshots/**
            docs/**
            tests/**
            scripts/**
            assets/**
            node_modules/**
            vite.config.js
            package.json
            package-lock.json
            .env.local
            .env.*.local
            .env.test
            phpunit.dist.xml
            bin/phpunit
            CLAUDE.md
