}

skinparam sequence {
  ParticipantBackgroundColor #f0eee8
  ParticipantBorderColor #b6bac2
  ParticipantFontColor #1c1f26
  ActorBackgroundColor #f0eee8
  ActorBorderColor #a2621c
  ActorFontColor #1c1f26
  LifeLineBorderColor #b6bac2
  LifeLineBackgroundColor #e6e3dc
  ArrowColor #a2621c
  ArrowFontColor #1c1f26
  GroupBackgroundColor #e6e3dc
  GroupBorderColor #b6bac2
  GroupFontColor #4a5160
  GroupHeaderFontColor #a2621c
  BoxBackgroundColor #fcfbf9
  BoxBorderColor #a2621c
  BoxFontColor #a2621c
  DividerBackgroundColor #e6e3dc
  DividerBorderColor #b6bac2
  DividerFontColor #4a5160
  ReferenceBackgroundColor #f0eee8
  ReferenceBorderColor #b6bac2
  ReferenceFontColor #1c1f26
  ReferenceHeaderBackgroundColor #e6e3dc
  StereotypeFontColor #a2621c
}

skinparam state {
  BackgroundColor #f0eee8
  BorderColor #b6bac2
  FontColor #1c1f26
  StartColor #a2621c
  EndColor #a2621c
  ArrowColor #a2621c
