@startuml
skinparam dpi 150
skinparam backgroundColor #fcfbf9
skinparam shadowing false
skinparam roundCorner 6

skinparam defaultFontName "DejaVu Sans"
skinparam defaultFontSize 14
skinparam defaultFontColor #1c1f26
skinparam defaultTextAlignment center


skinparam ArrowColor #a2621c
skinparam ArrowFontColor #1c1f26
skinparam ArrowThickness 1.5

skinparam node {
  BackgroundColor #f0eee8
  BorderColor #b6bac2
  FontColor #1c1f26
}

skinparam component {
  BackgroundColor #f0eee8
  BorderColor #b6bac2
  FontColor #1c1f26
}

skinparam rectangle {
  BackgroundColor #f0eee8
  BorderColor #b6bac2
  FontColor #1c1f26
}

skinparam package {
  BackgroundColor #fcfbf9
  BorderColor #a2621c
  FontColor #a2621c
}

skinparam folder {
  BackgroundColor #f0eee8
  BorderColor #b6bac2
  FontColor #1c1f26
}

skinparam frame {
  BackgroundColor #f0eee8
  BorderColor #b6bac2
  FontColor #1c1f26
}

skinparam database {
  BackgroundColor #e6e3dc
  BorderColor #b6bac2
  FontColor #1c1f26
}

skinparam queue {
  BackgroundColor #e6e3dc
  BorderColor #b6bac2
  FontColor #1c1f26
}

skinparam cloud {
  BackgroundColor #e6e3dc
  BorderColor #b6bac2
  FontColor #1c1f26
}

skinparam actor {
  BackgroundColor #f0eee8
  BorderColor #a2621c
  FontColor #1c1f26
}

skinparam usecase {
  BackgroundColor #f0eee8
  BorderColor #b6bac2
  FontColor #1c1f26
}

skinparam class {
  BackgroundColor #f0eee8
  BorderColor #b6bac2
  HeaderBackgroundColor #e6e3dc
  ArrowColor #a2621c
  FontColor #1c1f26
  AttributeFontColor #4a5160
  StereotypeFontColor #a2621c
}

skinparam object {
  BackgroundColor #f0eee8
  BorderColor #b6bac2
  FontColor #1c1f26
}

skinparam sequence {
  ParticipantBackgroundColor #f0eee8
  ParticipantBorderColor #b6bac2
  ParticipantFontColor #1c1f26
  ActorBackgroundColor #f0eee8
  ActorBorderColor #a2621c
  ActorFontColor #1c1f26
  LifeLineBorderColor #b6bac2
  LifeLineBackgroundColor #e6e3dc
  ArrowColor #a2621c
  ArrowFontColor #1c1f26
  GroupBackgroundColor #e6e3dc
  GroupBorderColor #b6bac2
  GroupFontColor #4a5160
  GroupHeaderFontColor #a2621c
  BoxBackgroundColor #fcfbf9
  BoxBorderColor #a2621c
  BoxFontColor #a2621c
  DividerBackgroundColor #e6e3dc
  DividerBorderColor #b6bac2
  DividerFontColor #4a5160
  ReferenceBackgroundColor #f0eee8
  ReferenceBorderColor #b6bac2
  ReferenceFontColor #1c1f26
  ReferenceHeaderBackgroundColor #e6e3dc
  StereotypeFontColor #a2621c
}

skinparam state {
  BackgroundColor #f0eee8
  BorderColor #b6bac2
  FontColor #1c1f26
  StartColor #a2621c
  EndColor #a2621c
  ArrowColor #a2621c
  AttributeFontColor #4a5160
}

skinparam activity {
  BackgroundColor #f0eee8
  BorderColor #b6bac2
  FontColor #1c1f26
  ArrowColor #a2621c
  StartColor #a2621c
  EndColor #a2621c
  BarColor #a2621c
  DiamondBackgroundColor #e6e3dc
  DiamondBorderColor #b6bac2
  DiamondFontColor #1c1f26
}

skinparam note {
  BackgroundColor #e6e3dc
  BorderColor #b6bac2
  FontColor #4a5160
}

skinparam title {
  FontColor #1c1f26
  FontSize 18
}

skinparam legend {
  BackgroundColor #f0eee8
  BorderColor #b6bac2
  FontColor #4a5160
}

skinparam caption {
  FontColor #4a5160
}

skinparam stereotype {
  CBackgroundColor #e6e3dc
  CBorderColor #a2621c
  ABackgroundColor #e6e3dc
  ABorderColor #a2621c
  IBackgroundColor #e6e3dc
  IBorderColor #a2621c
  EBackgroundColor #e6e3dc
  EBorderColor #a2621c
}

title E-shop: subdomény a úroveň investice do návrhu

rectangle "Core Domain" as core #a2621c {
  rectangle "Pricing & Promotions" as pricing
  rectangle "Personalized Recommendations" as recom
  note right of pricing
    KONKURENČNÍ VÝHODA
    plný DDD taktický design
    in-house, seniorní tým
  end note
}

rectangle "Supporting Subdomain" as supp {
  rectangle "Order Management" as order
  rectangle "Inventory" as inv
  note right of order
    Nutné pro byznys, ale ne diferenciátor
    DDD light + Doctrine ORM
    junior-medior tým
  end note
}

rectangle "Generic Subdomain" as gen {
  rectangle "Authentication" as auth
  rectangle "Payments (Stripe)" as pay
  rectangle "Email delivery (SES)" as email
  note right of auth
    Komodita
    SaaS / off-the-shelf knihovna
    minimum custom kódu
  end note
}

core -[hidden]down- supp
supp -[hidden]down- gen
@enduml

