    chapter: "ddd_pain_points"
    title: "Symfony Messenger: idempotence a pořadí zpráv v DDD"
    lead: "Provozní pasti Symfony Messengeru: jak dohledat ztracenou zprávu podle correlation ID, proč idempotency klíč z náhodného UUID nezastaví dvojklik, jak zapsat klíč bez závodu i bez ztracené zprávy, co dělat se zprávou, která přišla dřív než její předpoklad, a kde má vzniknout Command, když vstup přichází ze Symfony Form nebo z API Platform."
