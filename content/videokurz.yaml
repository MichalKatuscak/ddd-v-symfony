    chapter: "anti_patterns"
    title: "Anemic Domain Model a God Aggregate: chyby v modelu"
    lead: "Tři anti-vzory doménového modelu a jak je najít ve vlastním kódu: anémický model jako účet bez protihodnoty, Vernonův test dvou otázek a proč getter v PHP 8.4 už není spolehlivý příznak. Kdy anémie chybou není (Transaction Script), kdy se hodnotový objekt vyplatí a kdy je jen ceremonie, a proč God Aggregate nic nechrání – i to, že agregát jde zmenšit příliš."
