    chapter: "migration_from_crud"
    title: "Legacy CRUD na DDD: od kontroleru k agregátu"
    lead: "Jak dostat doménová pravidla z tlustého CRUD kontroleru do agregátu krok za krokem. Analýza domény a seznam toho, co nemigrovat. Hodnotové objekty a agregát User s pojmenovanou továrnou, repozitář a tenký kontroler s commandem. Charakterizační testy podle Michaela Featherse, švy v Symfony a záměrná změna chování, kterou schvaluje produkt."
