  - ep: "18a"
    chapter: "migration_from_crud"
    title: "Strangler Fig: migrace z CRUD na DDD bez přepisu"
    lead: "Kdy se migrace z CRUD na DDD vyplatí a kdy ji nezačínat. Strangler Fig místo přepisu najednou, Sacrificial Architecture a přechodová architektura, která má datum expirace. Datová migrace ve čtyřech fázích: dual-write, backfill, shadow reads a cutover přes feature flag. Anti-Corruption Layer s vyjmenovaným mapováním legacy stavů a techniky Branch by Abstraction, Parallel Change a Mikado."
