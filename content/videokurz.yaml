  - ep: "16b"
    chapter: "performance_aspects"
    title: "Unit of Work a hot aggregate: DDD pod zátěží"
    lead: "Výkon DDD aplikace na straně zápisu: kdy velký agregát opravdu zabolí a proč hranici určuje invariant, ne výkon. Identity Map, Unit of Work a dirty checking v Doctrine ORM 3, dávkový import s flush() a clear(), odpojené entity, read-only entity a DEFERRED_EXPLICIT. Hromadný DQL UPDATE, toIterable() a import rozdělený přes Symfony Messenger. V provozu hot aggregate a jeho metrika, pesimistický zámek jako anti-vzor, replikační lag, projection lag ve dvou číslech a čtyři čísla, která se vyplatí sledovat trvale."
    sections: "16.03, 16.05, 16.06, 16.08, 16.09, zbytek 16.10"
