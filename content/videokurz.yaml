  - ep: "17b"
    chapter: "testing_ddd"
    title: "Integrační testy Doctrine, Messenger a Deptrac"
    lead: "Testy tam, kde vstupuje infrastruktura. Integrační test repozitáře proti skutečné databázi, flush() a clear() kvůli Identity Map, transakční rollback přes dama/doctrine-test-bundle a jeho limity. Funkční test přes WebTestCase, asynchronní tok s in-memory transportem a zenstruck/messenger-test, test idempotence handleru a dvě garance outboxu. Architektonické testy s Deptracem a PHPArkitectem, code coverage a mutation testing s Infection."
