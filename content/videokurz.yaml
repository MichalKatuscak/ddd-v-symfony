  - ep: "16a"
    chapter: "performance_aspects"
    title: "N+1 a read model v Doctrine: rychlé čtení v DDD"
    lead: "Výkon DDD aplikace na straně čtení: tři mýty o pomalém DDD a celá Knuthova věta o předčasné optimalizaci. N+1 dotazy z lazy kolekce v Doctrine ORM 3, EXTRA_LAZY, fetch join v DQL, past setMaxResults s fetch joinem a Paginator, eager fetch po dávkách a keyset paging místo OFFSETu. Žebříček eskalace od indexu po asynchronní projekci, DQL NEW do DTO, cache read modelu přes Symfony Cache Contracts s tagy a invalidací z doménové události a dvě čísla ze Symfony Profileru."
    sections: "16.01, 16.02, 16.04, 16.07, část 16.10"
    duration: null
