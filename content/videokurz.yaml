    lead: "Závěrečný díl kurzu a druhá půlka ilustrativní případové studie: výpis projektů z denormalizované tabulky project_list_view místo hydratace agregátů (jsonb, GIN index ruční migrací, proč ne readOnly), projekce se čtyřmi handlery a jedním, který idempotentní není, reconciler z cronu pro přeházené zprávy, okno eventual consistency a pět rozhodnutí modelového týmu i s cenou. Na konci ohlédnutí za celým kurzem."
