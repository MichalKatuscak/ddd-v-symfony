    chapter: "anti_patterns"
    title: "DDD anti-patterns: sdílená databáze a měnitelné události"
    lead: "Anti-vzory na hranicích a jak je najít ve vlastním kódu: sdílená databáze mezi Bounded Contexty a tři cesty ven s jejich cenou, měnitelné události a proč potřebují dvě časová razítka, doménová pravidla v Doctrine repozitáři a jedno pravidlo pro Deptrac, over-engineering a drift Ubiquitous Language. Na konci přehled všech osmi anti-vzorů kapitoly s rozpoznávacími znaky."
