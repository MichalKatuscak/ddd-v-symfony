    title: "Doctrine a DDD agregát: Unit of Work, VO, identita"
    lead: "Kde Doctrine ORM 3 naráží na doménový model: transakce přes dva agregáty a zavřený EntityManager, getter, který nechtěně mění stav, flush($entity) a clear($entityName), které ORM 3 tiše ignoruje, mapování hodnotových objektů a dědičnosti a identita vytvořená v PHP ještě před uložením."
