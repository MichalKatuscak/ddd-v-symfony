    lead: "Ságy v Symfony: proč jedna transakce přes čtyři Bounded Contexty neexistuje a proč ji nenahradí two-phase commit. Kompenzace jako doménová operace, ne rollback, neúplný vs. nečitelný mezistav a nevratné akce. Choreografie a její čtyři limity, orchestrace přes OrderProcessManager jako stavový automat a hranice logiky v Process Manageru."
    sections: "14.01–14.05"
    duration: null
    youtube: null
    published: null
    chapters: []
  - ep: "14b"
    chapter: "sagas"
    title: "Saga v produkci: idempotence a timeouty"
    lead: "Ságy v Symfony v provozu: stav Process Manageru jako Doctrine entita, idempotentní přechody přes eventId, guard stavového automatu a unikátní index na korelaci, optimistický zámek. Chybějící izolace ságy a semantic lock na objednávce. Timeout check přes DelayStamp v Symfony Messengeru, forward a backward recovery, pivot transakce a kompenzace, které se jen opakují."
    sections: "14.06–14.09"
    duration: null
    youtube: null
    published: null
    chapters: []
  - ep: "15a"
    chapter: "outbox_pattern"
    title: "Outbox Pattern: konec ztracených událostí"
    lead: "Dual-write problem v Symfony: zápis do databáze a odeslání do RabbitMQ jsou dvě transakce ve dvou systémech, takže se události ztrácejí, nebo vznikají phantom eventy. Proč ne two-phase commit a XA. Transactional Outbox: událost v téže Doctrine transakci jako agregát, relay a doručení at-least-once. Schéma outbox tabulky, povinný index (status, occurred_at) a PlaceOrderHandler, který překládá doménovou událost na integrační."
    sections: "15.01–15.04"
    duration: null
    youtube: null
    published: null
    chapters: []
  - ep: "15b"
    chapter: "outbox_pattern"
    title: "Idempotent Inbox: události bez duplicit"
    lead: "Outbox v provozu: relay jako Polling Publisher v Symfony Console commandu, singleton, nebo FOR UPDATE SKIP LOCKED, past zavřeného EntityManageru. Debezium a Outbox Event Router, Doctrine transport jako outbox bez vlastní tabulky a proč pořadí platí jen per agregát. Idempotent Inbox s UNIQUE (event_id, consumer) v téže transakci a hranice exactly-once efektu. Outbox lag, kompakce, failed řádky, výpadek brokeru a migrace existujícího projektu krok za krokem."
    sections: "15.05–15.09"
    duration: null
    youtube: null
