    chapter: "microservices_and_ddd"
    title: "Microservices a Bounded Context: kdy stačí monolit"
    lead: "Bounded Context je logická hranice modelu, microservice fyzická hranice nasazení. Tři varianty mapování, šest podmínek pro vlastní službu, modulární monolit s hranicemi hlídanými PHPArkitectem a pět příznaků distributed monolithu."
