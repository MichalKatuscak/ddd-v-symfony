    chapter: "practical_examples"
    title: "DDD příklady v Symfony: e-shop, blog, uživatelé"
    lead: "Tři malé projekty v Symfony 8 na jedné kostře kontroler → command bus → handler → agregát → repozitář → událost. Proč objednávka tiše stojí bez relaye a workeru, tiché pasti instalace (Doctrine mapování, .env.local v testech), přechod z košíku do objednávky přes událost a překlad na hranici, kde leží pravidlo u blogu a u správy uživatelů a co se změní, až projekty porostou."
