  - ep: "17a"
    chapter: "testing_ddd"
    title: "Unit testy agregátů a InMemory repozitář v PHP"
    lead: "Testování doménové vrstvy bez Symfony kernelu: testovací pyramida, ice-cream cone a proč poměr vrstev kopíruje tloušťku doménové logiky. PHPUnit 13 s atributy místo anotací, test hodnotového objektu, entity a agregátu. Doménové události přes releaseEvents(), trait s asercemi a given-when-then nad event-sourced agregátem. Test doubles podle Meszarose a Fowlera, InMemory repozitář místo mocku a Test Data Builder pro testovací data."
