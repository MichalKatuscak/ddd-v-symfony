    title: "Microservices v Symfony Messengeru: kontrakt bez sdílení"
    lead: "Když Bounded Context dostane vlastní službu, hranice vede přes síť. Kdy volat synchronně a kdy publikovat událost, kolik dat událost nese, komu patří data, jak v Symfony Messengeru postavit kontrakt bez sdílené PHP třídy a co musí umět provoz."
